<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
       main{ 
        display: grid;
        grid-template-columns: 1fr 1fr 1fr ;
        grid-template-rows: 40px 100px;
        gap: 8px;
       }
       section{
        border: 2px solid #0b0101;
        padding: 10px;
        border-radius: 10px;
        text-align: center;
       }
    </style>
</head>
<body>
    <main>
        <section>Foto 1</section>
        <section>Foto 2</section>
        <section>Foto 3</section>
        <section>Foto 4</section>
        <section>Foto 5</section>
        <section>Foto 6</section>
    </main>
</body>
</html>
