<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #principal {
            display: grid;
            grid-template-areas:
            "header header"
            "lateral principal"
            "pie pie";
            border: 1px solid rgb(24, 159, 221);;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 1fr 3fr 1fr;
            gap: 8px;
            min-height: 100vh;
        }
        header {
            grid-area: header;
            border: 2px solid rgb(24, 159, 221);
            border-radius: 10px;
            text-align: center;
            color:  rgb(11, 71, 99);;
        }
        aside {
            grid-area: lateral;
            border: 2px solid rgb(24, 159, 221);
            border-radius: 10px;
               text-align: center;
               color:  rgb(11, 71, 99);;
        }
        main {
            grid-area: principal;
            border: 2px solid rgb(24, 159, 221);
            border-radius: 10px;
            text-align: center;
            color:  rgb(11, 71, 99);;
        }
        footer {
            grid-area: pie;
            border: 2px solid rgb(24, 159, 221);
            border-radius: 10px;
            text-align: center;
            color: rgb(11, 71, 99);;
        }
    </style>
</head>

<body>
    <div id= "principal">
        <header>Encabezado</header>
        <aside>Menu lateral</aside>
            <main>Contenido principal</main>
                <footer>Pie de pagina</footer>
    </div>
</body>

</html>
